<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de nombre</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="tarjeta">
    <h1>Registro</h1>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="aviso {{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    <form action="{{ url_for('enviar') }}" method="post">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" maxlength="100"
             placeholder="Escribe tu nombre" required autofocus>
      <button type="submit">Enviar</button>
    </form>
  </main>
</body>
</html>
